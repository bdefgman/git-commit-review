[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-commit-review"
version = "0.1.0"
description = "提交前的 AI 代码规范审查，不合规直接拦截 git commit"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
aicr = "review.cli:main"

[tool.setuptools.packages.find]
include = ["review*"]
