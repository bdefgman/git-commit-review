# 可选文件。不建这个文件也能用：只要仓库里有 .ai-review/rules.md 即可。
# 需要调优时，把它复制到 <仓库>/.ai-review/config.toml，只写要改的项。

[model]
# 换模型/换内网网关只改这两行，Key 从环境变量读
# base_url = "https://api.deepseek.com"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_API_KEY"

[conventions]
# 默认自动读取 .ai-review/rules.md，只有想用其他文件名时才需要写
# sources = [".ai-review/rules.md", ".ai-review/java.md"]

[review]
# 排除不想审的目录（默认已排除 target/build/node_modules/generated 等）
# exclude = ["**/target/**", "**/generated/**"]

# 其余配置项都有合理默认值，等真的需要时再看 README 末尾的完整表格
